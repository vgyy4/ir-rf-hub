name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ir_rf_hub/backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend build & type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ir_rf_hub/frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
