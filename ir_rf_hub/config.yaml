name: "IR-RF Command Hub"
version: "0.1.13"
slug: "ir_rf_hub"
description: "Record, name, edit, and fire IR/RF commands through ESPHome IR/RF proxy devices"
url: "https://github.com/vgyy4/ir-rf-hub"
image: "ghcr.io/vgyy4/ir-rf-hub"
arch:
  - aarch64
  - amd64
init: false
# Grants SUPERVISOR_TOKEN + access to http://supervisor/* -- used only to
# POST /discovery so the companion integration can find and pair with the
# App automatically (supervisor_discovery.py). Does not require
# host_network: the discovery hand-off is a Supervisor API call, not real
# mDNS -- see ARCHITECTURE.md's Pairing section for why host_network
# specifically breaks this App instead.
hassio_api: true
discovery:
  - ir_rf_hub
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: IR-RF Hub
map:
  - type: data
    read_only: false
backup: hot
backup_pre: rootfs/backup_pre.sh
backup_post: rootfs/backup_post.sh
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)
