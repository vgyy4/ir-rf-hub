name: "IR-RF Command Hub"
version: "0.1.1"
slug: "ir_rf_hub"
description: "Record, name, edit, and fire IR/RF commands through ESPHome IR/RF proxy devices"
url: "https://github.com/vgyy4/ir-rf-hub"
image: "ghcr.io/vgyy4/ir-rf-hub"
arch:
  - aarch64
  - amd64
init: false
# Needed for esphome/discovery.py's mDNS browse to actually see
# _esphomelib._tcp.local. traffic from LAN devices -- Supervisor's default
# isolated bridge network doesn't forward multicast from the host's LAN,
# the same reason the official ESPHome add-on also runs host_network.
# Supervisor still resolves this add-on's internal hostname correctly for
# the App<->integration pairing handshake (main.py's socket.gethostname())
# regardless of network mode.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: IR-RF Hub
map:
  - type: data
    read_only: false
backup: hot
backup_pre: rootfs/backup_pre.sh
backup_post: rootfs/backup_post.sh
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)
