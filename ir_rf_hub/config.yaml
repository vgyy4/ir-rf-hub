name: "IR-RF Command Hub"
version: "0.1.1"
slug: "ir_rf_hub"
description: "Record, name, edit, and fire IR/RF commands through ESPHome IR/RF proxy devices"
url: "https://github.com/vgyy4/ir-rf-hub"
image: "ghcr.io/vgyy4/ir-rf-hub"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
